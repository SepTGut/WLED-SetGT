[wokwi]
version = 1
firmware = '.pio/build/esp32dev/firmware_merged.bin'
elf = '.pio/build/esp32dev/firmware.elf'

# Wokwi Wi-Fi & Gateway Settings
# https://docs.wokwi.com/guides/esp32-wifi
[net]
enabled = true
gdbServer = true

# Forward http://localhost:8180 to port 80 on simulated ESP32
[[net.forward]]
from = "localhost:8180"
to = "target:80"
